<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SmetaGo</title>
<script>
/* til (UZ/RU) va ekran (ro'yxat yoki muharrir) — sahifa chizilishidan oldin */
(function(){var l="uz";try{if(localStorage.getItem("smetago-off-lang")==="ru")l="ru"}catch(e){}
  var h=document.documentElement;h.lang=l;h.className=/^#p=[\w-]+$/.test(location.hash)?"m-editor":"m-home";})();
</script>
<script>/* SmetaGo — kunduzgi / tungi rejim. <head> ichida sinxron yuklanadi, shunda sahifa
 * noto'g'ri rangda "miltillamaydi". Tanlov brauzerda (localStorage) saqlanadi;
 * tanlanmagan bo'lsa, tizim sozlamasi (prefers-color-scheme) ishlaydi. */
(function(){
  var KEY="smetago-theme",root=document.documentElement,mq=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");
  try{var s=localStorage.getItem(KEY);if(s==="light"||s==="dark")root.setAttribute("data-theme",s)}catch(e){}
  // til — faqat serverdan (<html lang>): brauzer xotirasidagi eski tanlov sahifani aralash tilga o'tkazmasin
  try{localStorage.removeItem("smetago-lang")}catch(e){}
  function cur(){return root.getAttribute("data-theme")||(mq&&mq.matches?"dark":"light")}
  function sync(){var dark=cur()==="dark";
    // o'rnatilgan ilovada holat paneli rangi sarlavhaga mos bo'lsin (foydalanuvchi tanlagan rejim bo'yicha)
    if(root.hasAttribute("data-theme"))document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=dark?"#111827":"#ffffff"});
    document.querySelectorAll("[data-theme-toggle]").forEach(function(b){
      var l=b.getAttribute(dark?"data-l-day":"data-l-night");b.setAttribute("aria-pressed",dark);b.title=l;b.setAttribute("aria-label",l)})}
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-theme-toggle]");if(!b)return;
    var n=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem(KEY,n)}catch(e){}sync()});
  document.addEventListener("DOMContentLoaded",sync);
  if(mq&&mq.addEventListener)mq.addEventListener("change",sync);
})();
</script>
<style>/* SmetaGo — professional qurilish va arxitektura dizayn tizimi.
 * Ko'zni charchatmaydigan, me'moriy chizma va qurilish standartlariga mos palitra.
 * Asosiy neytral: Slate (kulrang-ko'k me'moriy qog'oz)
 * Asosiy e'tibor (CTA & Action): Qurilish tilla-zarg'aldoq (Construction Amber / Safety Gold)
 */
:root{
  color-scheme:light;
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --accent:#d97706; --accent-soft:#fef3c7; --on-accent:#ffffff;
  --steel:#334155; --steel-soft:#f1f5f9; --danger:#dc2626; --good:#d97706;
  --bar:#0f172a; --on-bar:#f8fafc; --bar-accent:#f59e0b;
  --grid-minor:rgba(15,23,42,.035); --grid-major:rgba(15,23,42,.07); --dim:#d97706;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);
  --r:10px;
  --f-display:"Onest","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1120; --surface:#111827; --surface2:#1f2937; --ink:#f1f5f9; --muted:#94a3b8;
    --line:#283548; --accent:#f59e0b; --accent-soft:#451a03; --on-accent:#0b1120;
    --steel:#94a3b8; --steel-soft:#1e293b; --danger:#ef4444; --good:#f59e0b;
    --bar:#050811; --on-bar:#f1f5f9; --bar-accent:#f59e0b;
    --grid-minor:rgba(241,245,249,.03); --grid-major:rgba(241,245,249,.06); --dim:#f59e0b;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1120; --surface:#111827; --surface2:#1f2937; --ink:#f1f5f9; --muted:#94a3b8;
  --line:#283548; --accent:#f59e0b; --accent-soft:#451a03; --on-accent:#0b1120;
  --steel:#94a3b8; --steel-soft:#1e293b; --danger:#ef4444; --good:#f59e0b;
  --bar:#050811; --on-bar:#f1f5f9; --bar-accent:#f59e0b;
  --grid-minor:rgba(241,245,249,.03); --grid-major:rgba(241,245,249,.06); --dim:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0}  /* brauzerning standart 8 px chetini olib tashlaydi */
/* ichki sahifalar — toza "dashboard" foni */
body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:700}
.brand small{font:500 10px var(--f-mono);color:var(--muted);letter-spacing:.2em;text-transform:uppercase;display:block;margin-top:-2px}
.objmeta{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.objmeta input,.objmeta select{min-width:0}
.objmeta #o-name{flex:1 1 220px}
.ruler{height:3px;background:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px}
.top .tabs{flex-wrap:nowrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
/* til va rejim tugmalari */
.prefs{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.seg button{border:0;background:transparent;padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.themebtn svg{width:18px;height:18px}
.themebtn .sun,.themebtn[aria-pressed="true"] .moon{display:none}
.themebtn[aria-pressed="true"] .sun{display:block}
.seg button:focus-visible,.themebtn:focus-visible{outline:2px solid var(--steel);outline-offset:1px}

/* controls */
.inp,select.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.inp:focus,select.inp:focus,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.cat-item:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.inp.numin{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
a.btn{color:inherit;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(.95)}
/* Ajralib turuvchi asosiy tugma: Yangi smeta (Qurilish Amber / Safety Gold) */
.btn-new-smeta {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
  color: #ffffff !important;
  border: 1px solid #b45309 !important;
  font-weight: 700 !important;
  font-size: 14.5px !important;
  letter-spacing: -0.01em;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.42), 0 1px 2px rgba(0, 0, 0, 0.12) !important;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-new-smeta:hover {
  background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%) !important;
  transform: translateY(-1.5px) !important;
  box-shadow: 0 6px 20px rgba(217, 119, 6, 0.55), 0 2px 4px rgba(0, 0, 0, 0.15) !important;
  filter: brightness(1.05);
}
.btn-new-smeta:active {
  transform: translateY(0) !important;
  box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3) !important;
}
/* Beton kalkulyatori va bo'limi */
.beton-hero {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border: 1px solid #334155;
  border-radius: var(--r);
  padding: 24px;
  color: #f1f5f9;
  box-shadow: 0 8px 30px rgba(15, 23, 42, 0.18);
}
.beton-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(245, 158, 11, 0.18);
  color: #f59e0b;
  border: 1px solid rgba(245, 158, 11, 0.35);
  padding: 4px 10px;
  border-radius: 999px;
}
.beton-recipes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.beton-recipe-card {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.beton-recipe-card:hover {
  transform: translateY(-2px);
  border-color: #f59e0b;
  background: rgba(245, 158, 11, 0.08);
}
.beton-recipe-card small {
  color: #94a3b8;
  font-size: 11px;
}
.beton-recipe-card b {
  font-size: 16px;
  color: #f8fafc;
  font-family: var(--f-mono);
}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--danger);border-color:transparent}
.btn.sm{padding:5px 9px;font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* layout */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;gap:20px;padding-block:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* room list */
.roomlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.roomlist ul{list-style:none;margin:0;padding:6px}
.roombtn{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.roombtn:hover{background:var(--surface2)}
.roombtn[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.roombtn b{font-weight:600}
.roombtn span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.addroom{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
/* ro'yxatdagi har xona yonida o'chirish (×) */
.roomlist li{position:relative}
.roomlist li .roombtn{padding-right:36px}
.roomdel{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.roomdel:hover,.roomdel:focus-visible{color:var(--danger);background:var(--surface2)}
.btn.btn-del{color:var(--danger);border-color:var(--danger);background:transparent;white-space:nowrap}
.btn.btn-del:hover{background:var(--danger);color:#fff}

/* room edit */
.roomhead{display:flex;gap:10px;align-items:center}
.roomhead input{font-family:var(--f-display);font-weight:600;font-size:20px;border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;padding:4px 0;flex:1;min-width:0}
.roomhead input:focus{outline:none;border-bottom-color:var(--steel)}
.dimline{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* min-width:0 — fieldset standart min-content kengligi telefonda sahifani gorizontal cho'zmasin */
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:8px}
.openings{display:flex;flex-wrap:wrap;gap:8px}
.opening{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:8px;padding:4px 4px 4px 10px;font-size:13px}
.opening input{width:62px;padding:5px 6px}
.opening select{width:auto;padding:5px 6px}
.opening input.qn{width:44px}
.opening .m2{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;padding-left:2px}
.opsum{margin:6px 0 0}
.opsum:empty{display:none}
.fcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.fdims{display:flex;gap:6px}
.fdims .fld{flex:1}
.adddoor{margin-top:8px}
.opening .x{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px}
.opening .x:hover{color:var(--danger)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.metric{background:var(--surface);padding:10px 12px}
.metric .v{font-family:var(--f-mono);font-size:18px;font-weight:500}
.metric .v small{font-size:12px;color:var(--muted);margin-left:2px}
.metric .k{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.hint{background:var(--steel-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--surface2);font-family:var(--f-display);font-weight:600;font-size:14px}
tr.sub td{font-weight:600}
td .inp{padding:5px 7px}
td .qty{width:84px}
td .price{width:120px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.auto{background:var(--steel-soft);color:var(--steel)}
.tag.own{background:var(--accent-soft);color:var(--ink)}
.itemname{font-weight:500}
.itemsub{font-size:12px;color:var(--muted)}

/* catalog */
.catalog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.catalog .head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catbody{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:14px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat-item{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.cat-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.cat-item b{font-weight:500;font-size:13.5px;line-height:1.3}
.cat-item span{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.cat-item.sugg{border-style:dashed}
.addown{border:1.5px dashed var(--ink);background:transparent;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;width:100%}
.addown:hover{background:var(--accent-soft)}

/* total bar */
.totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--on-bar);border-top:2px solid var(--accent);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.totalbar .wrap{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;padding-block:12px}
.totalbar .t{display:flex;flex-direction:column}
.totalbar .t span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.totalbar .t b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.totalbar .t.grand b{font-size:20px;color:var(--bar-accent)}
.totalbar .spacer{flex:1}
.totalbar .btn{background:var(--bar-accent);border-color:var(--bar-accent);color:#03140a}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px;z-index:40}
.sheet{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .sh{padding:18px 18px 0;display:flex;justify-content:space-between;gap:10px;align-items:start}
.sheet .sb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sheet .sf{padding:0 18px 18px;display:flex;gap:8px;justify-content:flex-end}
.preview{background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:13px}

/* concrete & prices */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}
.ccard{display:flex;flex-direction:column;gap:12px}
.mix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mix div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.mix b{display:block;font-family:var(--f-mono);font-weight:500}
.mix span{font-size:11.5px;color:var(--muted)}
.big{font-family:var(--f-mono);font-size:22px}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;padding-block:20px 12px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.section{padding-bottom:24px;display:flex;flex-direction:column;gap:14px}
.srcs{display:flex;gap:6px}
.ptable .p-src input{width:110px}
.mobonly{display:none!important}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.srcs input{width:100px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;font-weight:600;z-index:50}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sumgrid div{background:var(--surface);padding:12px 14px}
.sumgrid span{font-size:12px;color:var(--muted);display:block}
.sumgrid b{font-family:var(--f-mono);font-weight:500;font-size:18px}
.sumgrid .g{background:var(--accent-soft)}

/* Excel ko'rinishi: yuklab olinadigan .xlsx bilan bir xil varaq (rejimdan qat'i nazar "qog'oz" ranglari) */
.xl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;color:#0f172a;color-scheme:light}
.xl-scroll{overflow:auto;max-height:72vh}
.xlgrid{border-collapse:separate;border-spacing:0;table-layout:fixed;font:13px/1.35 Calibri,Carlito,"Segoe UI",system-ui,sans-serif}
.xlgrid td,.xlgrid th{border:0;border-right:1px solid #e3e6e9;border-bottom:1px solid #e3e6e9;padding:3px 6px;height:23px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:left;vertical-align:bottom;font:inherit;letter-spacing:0;text-transform:none;color:#0f172a;background:transparent}
.xlgrid td.x-ov{overflow:visible}
.xlgrid thead th{position:sticky;top:0;z-index:2;background:#f1f3f4;color:#5f6368;text-align:center;font-size:12px}
.xlgrid tbody th{position:sticky;left:0;z-index:1;background:#f1f3f4;color:#5f6368;text-align:center;font-size:12px}
.xlgrid thead th.xl-corner{left:0;z-index:3}
.xlgrid tr.x-t td{border-color:#c9d5cc}
.xlgrid .x-n{text-align:right;font-variant-numeric:tabular-nums}
.xlgrid .x-title{font-size:18px;font-weight:700;height:30px}
.xlgrid .x-meta{color:#536159}
.xlgrid .x-head{background:#d97706;color:#fff;font-weight:700;text-align:center;vertical-align:middle;white-space:normal;height:42px}
.xlgrid .x-group{background:#fef3c7;font-weight:700}
.xlgrid .x-sub{background:#eef3ef;font-weight:700}
.xlgrid .x-total,.xlgrid .x-b{font-weight:700}
.xlgrid .x-grand{background:#0f172a;color:#fbbf24;font-weight:700;font-size:14px}
.xl-tabs{display:flex;gap:2px;padding:0 8px;background:#f1f3f4;border-top:1px solid #dadce0}
.xl-tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:7px 16px;font:600 13px "Segoe UI",system-ui,sans-serif;color:#5f6368;cursor:pointer}
.xl-tabs button[aria-pressed="true"]{background:#fff;color:#d97706;border-bottom-color:#d97706}
.totalbar .btn.xlbtn{background:transparent;color:var(--on-bar);border-color:rgba(255,255,255,.28)}
.totalbar .btn.xlbtn:hover{border-color:var(--bar-accent);color:var(--bar-accent)}
.btn:disabled{opacity:.55;cursor:progress}

/* PWA: o'rnatish tugmasi, oflayn belgisi, o'rnatilgan ilova rejimi */

/* sayt: bosh sahifa (landing) — jonli kalkulyator, uch qadam, kim uchun, chaqiruv */
/* oddiy sahifalar (sayt): torroq kenglik va pastda 'jami' paneli uchun joy kerak emas */
body.site{padding-bottom:0}
.site .wrap{max-width:1240px}
.sitenav{flex:1;display:flex;justify-content:center;gap:28px}
.sitenav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.sitenav a:hover{color:var(--ink)}
.landing{--hi:#b45309} /* kunduzgi: ochiq yashil fonda ham kontrast ≥ 4.5 (WCAG AA) */
:root[data-theme="dark"] .landing{--hi:#fbbf24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .landing{--hi:#fbbf24}}
.kicker{font:600 12px/1.4 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--hi);margin:0 0 10px}
.sec-title{font-size:clamp(28px,3.4vw,44px);line-height:1.08;letter-spacing:-.02em;max-width:22ch;margin:0 0 32px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:10px}
.btn.block{display:flex;width:100%;justify-content:center;padding:14px;font-size:15px;border-radius:10px}
.hero-wrap{position:relative;border-bottom:1px solid var(--line);
  background-image:linear-gradient(color-mix(in srgb,var(--accent) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:56px;align-items:center;padding-block:56px}
.pill{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:6px 14px;border:1px solid color-mix(in srgb,var(--hi) 45%,transparent);border-radius:99px;background:color-mix(in srgb,var(--hi) 8%,transparent);font:600 11px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--hi)}
.pill .dot{width:6px;height:6px;border-radius:99px;background:var(--hi)}
.hero h1{font-size:clamp(40px,5.4vw,74px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 22px}
.hero h1 em{font-style:normal;color:var(--hi)}
.hero .lead{font-size:18px;line-height:1.6;color:var(--muted);margin:0 0 28px;max-width:52ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:14px}
.checks li{display:flex;align-items:center;gap:7px}
.checks li::before{content:"";width:10px;height:5px;margin-top:-3px;border-left:2px solid var(--hi);border-bottom:2px solid var(--hi);transform:rotate(-45deg)}
/* kalkulyator */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.18);overflow:hidden}
.calc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.calc-head h2{font-size:19px}
.calc-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.live{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--hi);border:1px solid color-mix(in srgb,var(--hi) 45%,transparent);background:color-mix(in srgb,var(--hi) 10%,transparent);border-radius:6px;padding:3px 8px}
.calc-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
.stepper button{border:0;background:transparent;width:34px;height:40px;font-size:18px;color:var(--muted);cursor:pointer;flex:none}
.stepper button:hover{color:var(--hi)}
.stepper input{border:0;background:transparent;width:100%;min-width:0;text-align:center;font:600 16px var(--f-mono);color:var(--ink)}
.stepper input:focus{outline:none}
.stepper:focus-within{border-color:var(--hi)}
.calc-grid select.inp{background:var(--bg);padding:10px}
.calc-plan{border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.calc-plan svg{display:block;width:100%;height:auto;max-height:190px}
.calc-assume{margin:-6px 0 0}
.calc-lines{list-style:none;margin:0;padding:0}
.calc-lines li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.calc-lines li:last-child{border-bottom:0}
.calc-lines b{display:block;font-size:14px;font-weight:600}
.calc-lines small{display:block;font:12px var(--f-mono);color:var(--hi);margin-top:2px}
.calc-lines .r{text-align:right;flex:none}
.calc-lines .r b{font-family:var(--f-mono)}
.calc-lines .r small{color:var(--muted)}
.calc-foot{padding:18px 22px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.calc-total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.calc-total small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.calc-total b{font:600 clamp(24px,3vw,32px) var(--f-mono);color:var(--hi);white-space:nowrap}
.calc-total b span{font-size:15px}
.calc-foot .note{text-align:center;margin:10px 0 0}
/* bo'limlar */
.block{padding-block:88px 8px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--surface)}
.step h3{font-size:20px;margin:0 0 10px}
.step p{margin:0;color:var(--muted);line-height:1.6}
.step .kicker{color:var(--hi);margin-bottom:10px}
.who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;align-items:start;padding-bottom:88px}
.roles{margin:0;border-top:1px solid var(--line)}
.roles div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.roles dt{font-family:var(--f-display);font-weight:700;font-size:16px}
.roles dd{margin:0;color:var(--muted);line-height:1.6}
.ctaband{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:44px 40px;border-radius:22px;background:#f59e0b;color:#03140a;margin-bottom:72px}
.ctaband h2{font-size:clamp(24px,2.8vw,36px);letter-spacing:-.02em}
.ctaband p{margin:8px 0 0;font-size:16px;opacity:.85}
.ctaband .btn{background:#0f172a;border-color:#0f172a;color:#eef5f0;flex:none}
.ctaband .btn:hover{filter:none;background:#000}
/* pastki qator (barcha oddiy sahifalar) */
.site-foot{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.site-foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:22px}
.site-foot nav{display:flex;gap:22px}
.site-foot a{color:var(--muted);text-decoration:none}
.site-foot a:hover{color:var(--ink)}
/* namuna (demo) sahifasi */
.demobar{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13.5px}
.demobar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding-block:8px}
/* matnli sahifalar: yordam, maxfiylik */
.prose{max-width:760px}
.prose h1{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;margin:0 0 8px}
.prose h2{font-size:20px;margin:28px 0 8px}
.prose p,.prose li{color:var(--muted);line-height:1.7}
.prose ul{padding-left:20px}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink)}
.faq details p{margin:10px 0 0}
@media (max-width:1180px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:36px}}
@media (max-width:980px){
  .hero,.who{grid-template-columns:minmax(0,1fr)}
  .steps3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .hero{padding-block:32px;gap:28px}
  .hero .lead{font-size:16px}
  .hero-cta .btn{flex:1;justify-content:center}
  .calc-head,.calc-body,.calc-foot{padding-inline:16px}
  .calc-grid .fld{font-size:11.5px}
  .stepper button{width:28px}
  .stepper input{font-size:15px}
  .block{padding-block:56px 4px}
  .who{padding-bottom:56px;gap:20px}
  .roles div{grid-template-columns:minmax(0,1fr);gap:4px}
  .ctaband{flex-direction:column;align-items:flex-start;padding:28px 22px;margin-bottom:48px}
  .ctaband .btn{width:100%;justify-content:center}
}
/* chizma: xona rejasi o'lcham chiziqlari bilan (calc.js planSvg) */
.plan{display:block;width:100%;height:auto;max-height:220px}
.roomplan{padding:10px 14px}
.roomplan .plan{max-height:170px;margin-inline:auto;max-width:380px}

.plan .pl-t{font:600 12px var(--f-mono);fill:var(--ink)}
.plan .pl-a{font:500 13px var(--f-mono);fill:var(--muted)}
/* +/− tugmalar: kompyuterda yashirin, telefonda katta (qo'lqop bilan ham bosiladi) */
.stp{display:contents}
.stp-b{display:none}

/* ============ Ichki sahifalar (body.in — tizimga kirgan): dashboard uslubi (rangli yuqori panel, kartalar) ============ */
:root{--r:14px;--hdr1:#0f172a;--hdr2:#b45309;--shadow:0 1px 2px rgba(16,24,20,.05),0 8px 24px rgba(16,24,20,.06)}
:root[data-theme="dark"]{--hdr1:#0b1120;--hdr2:#0f172a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hdr1:#0b1120;--hdr2:#0f172a}}
body.in .panel{box-shadow:var(--shadow);border-color:var(--line)}
body.in .top{background:linear-gradient(100deg,var(--hdr1),var(--hdr2));color:#fff;border:0}
.in .top .brand .mark{background:#fff;color:var(--hdr1)}
.in .top .brand small{color:rgba(255,255,255,.7)}
.in .top .btn,.in .top .themebtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.in .top .btn:hover,.in .top .themebtn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.in .top .btn.pri{background:#fff;border-color:#fff;color:var(--hdr1)}
.in .top .seg{border-color:rgba(255,255,255,.25)}
.in .top .seg button{color:rgba(255,255,255,.75)}
.in .top .seg button+button{border-left-color:rgba(255,255,255,.25)}
.in .top .seg button[aria-pressed="true"]{background:#fff;color:var(--hdr1)}
.in .top .objmeta .inp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.in .top .objmeta .inp::placeholder{color:rgba(255,255,255,.6)}
.in .top .objmeta option{color:#0f172a;background:#fff}
.in .top .tab{color:rgba(255,255,255,.78)}
.in .top .tab:hover{background:rgba(255,255,255,.12);color:#fff}
.in .top .tab[aria-selected="true"]{background:#fff;color:var(--hdr1)}
.in .top .ruler{opacity:.55}
.in .userbar{color:rgba(255,255,255,.85)}
.uchip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:99px;background:rgba(255,255,255,.12)}
.uchip .avatar{width:30px;height:30px;border-radius:99px;background:#fbbf24;color:#3b2503;display:grid;place-items:center;font:700 12px var(--f-body)}
.uchip b{display:block;font-size:13px;color:#fff;line-height:1.1}
.uchip small{display:block;font-size:11px;color:rgba(255,255,255,.7);line-height:1.1}
/* Asosiy (dashboard) */
.dash{display:flex;flex-direction:column;gap:18px}
.dash-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.dash-head h1{font-size:26px}
.dash-head h2{font-size:20px}
.dash-head .ometa{margin:2px 0 0}
.dash-seg{background:var(--surface);box-shadow:var(--shadow);border-radius:10px}
.dash-seg button{padding:7px 14px}
.dash-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.dash-chart{background:linear-gradient(160deg,#111827,#1e293b);color:#e9f5ee;border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.dc-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:8px}
.dc-k{font-size:13px;opacity:.75;display:block}
.dc-v{font:700 28px var(--f-mono);letter-spacing:-.02em}
.dc-badge{font:600 12px var(--f-mono);background:rgba(251,191,36,.15);color:#fcd34d;border-radius:99px;padding:4px 10px;white-space:nowrap}
.dc-svg svg{display:block;width:100%;height:auto}
.dc-grid{stroke:rgba(255,255,255,.1)}
.dc-ax{font:11px var(--f-mono);fill:rgba(233,245,238,.6)}
.dc-bar{fill:#fbbf24}
.dc-empty{opacity:.7;padding:60px 0;text-align:center;margin:0}
.kpis{display:grid;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 10px}
.kpi-k{grid-column:1 / -1;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.kpi-k i{width:8px;height:8px;border-radius:99px}
.kpi b{font-size:20px;font-weight:700;white-space:nowrap}
.spark{width:96px;height:30px}
.dash-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.dcard{padding:18px 20px;min-width:0}
.dcard h3{font-size:16px}
.dcard>.ometa{margin:2px 0 14px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow div{text-align:right}
.srow b{display:block;font-weight:600}
.srow small,.legend small{color:var(--muted);font-size:11.5px}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{width:130px;flex:none}
.dn-v{font:700 18px var(--f-mono);fill:var(--ink)}
.dn-k{font:11px var(--f-body);fill:var(--muted)}
.dn-empty{stroke:var(--surface2)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;font-size:13px}
.legend li{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{text-align:right;font-weight:600}
.legend small{grid-column:3;text-align:right}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.toplist li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center}
.toplist .tn{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 12px var(--f-mono)}
.toplist li:nth-child(2) .tn{background:#f59e0b;color:#3b2503}
.toplist li:nth-child(3) .tn{background:#8b5cf6;color:#fff}
.toplist li:nth-child(n+4) .tn{background:var(--surface2);color:var(--muted)}
.toplist a{color:var(--ink);font-weight:600;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist a:hover{text-decoration:underline}
.toplist b{font-size:13px}
.ocard .osum{font-size:18px;font-weight:700}
@media (max-width:1100px){.dash-top{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-row{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .kpi{grid-template-columns:minmax(0,1fr);padding:12px}
  .kpi b{font-size:16px}
  .spark{width:100%}
  .dash-chart{padding:16px}
  .dc-v{font-size:22px}
  .dash-seg{width:100%}
  .dash-seg button{flex:1}
  .donut-wrap{flex-direction:column;align-items:stretch}
  .donut{margin-inline:auto}
}

/* Telegram orqali kirish; sahifa xabarlari */
.tg-login{display:flex;justify-content:center;min-height:40px}
.tg-link{display:flex;align-items:center;gap:8px}
.tg-link .tg-login{min-height:0}
.or{display:flex;align-items:center;gap:10px;margin:0;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.msgs p{margin:0}
.msg-error{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--ink)}

/* audit tuzatishlari: telefonda eshik qatori o'raladi; kichik tugmalar kattaroq (≥40 px); kontrast (WCAG AA) */
@media (max-width:760px){
  .opening{flex-wrap:wrap;row-gap:6px;max-width:100%}
  .opening select{flex:1 1 150px;min-height:40px}
  .seg button{min-height:40px;min-width:44px}
  .themebtn{width:40px;height:40px}
  .site-foot nav{gap:4px 8px;flex-wrap:wrap}
  .site-foot a,.sitenav a{display:inline-flex;align-items:center;min-height:40px;padding-inline:6px}
  .auth a,.ometa a{display:inline-block;padding-block:8px}
  .btn.sm{min-height:40px}
  .opening .x{min-width:40px;min-height:40px}
  .stepper button{width:44px;height:46px}
  .stepper input{font-size:18px}
  .calc-grid{grid-template-columns:minmax(0,1fr)}  /* 3 ustunda raqam va "Laminat" kesilib qolardi */
  .toplist a,.ocard a.oname{padding-block:4px}
}
.toplist li:nth-child(3) .tn{background:#7c3aed}

/* ============ Kirish sahifalari (body.authp): chapda jonli 3D xona, o'ngda forma — doim to'q ============ */
.r3d{display:block;width:100%;aspect-ratio:16/11;user-select:none;-webkit-user-select:none}
body.authp{
  --bg:#0c100d; --surface:#121814; --surface2:#182019; --ink:#eef3ef; --muted:#9aa89f; --line:#232d26;
  --accent:#f59e0b; --accent-soft:#111827; --on-accent:#10170a; --steel:#fbbf24; --dim:#f59e0b; --danger:#f28b82;
  color-scheme:dark;background:var(--bg);color:var(--ink);padding:0;min-height:100vh}
.au{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.au-art{position:relative;margin:16px 0 16px 16px;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(70% 55% at 50% 45%,rgba(245,158,11,.07),transparent 70%),
    linear-gradient(rgba(245,158,11,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(245,158,11,.05) 1px,transparent 1px) 0 0/48px 48px,#0e1310}
.au-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 26px 0;font-size:13.5px;color:var(--muted)}
.au-live{display:inline-flex;align-items:center;gap:8px}
.au-live i{width:12px;height:12px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 4px rgba(245,158,11,.18),0 0 12px rgba(245,158,11,.6)}
.au-rot{font-size:13px;letter-spacing:.04em}
.au-canvas{flex:1;aspect-ratio:auto;min-height:0;height:auto}
.au-bottom{padding:0 26px 26px}
.au-lead{font:700 clamp(20px,2.2vw,28px)/1.25 var(--f-display);letter-spacing:-.015em;margin:0 0 18px;max-width:30ch}
.au-steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.au-steps li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:6px 16px 6px 6px;font-size:14.5px;background:rgba(0,0,0,.2)}
.au-steps b{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 12px var(--f-mono)}
.au-main{display:flex;flex-direction:column;padding:24px clamp(20px,5vw,72px)}
.au-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.au-brand{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.au-brand .mark{width:48px;height:48px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 22px var(--f-display)}
.au-brand b{display:block;font:700 19px var(--f-display)}
.au-brand small{display:block;color:var(--muted);font-size:13px}
.authp .seg{border-color:var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--surface)}
.authp .seg button{border-radius:7px;min-width:44px;min-height:36px}
.authp .seg button+button{border-left:0}
.authp .seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.au-body{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:500px;padding-block:40px}
.au-body h1{font:700 clamp(38px,4.4vw,54px)/1.05 var(--f-display);letter-spacing:-.03em;margin:0 0 14px}
.au-sub{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 30px;max-width:40ch}
.au-form{display:flex;flex-direction:column;gap:20px}
.au-f{display:flex;flex-direction:column;gap:8px}
.au-f label{font-size:14.5px;color:#c9d3cc}
.au-in{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;min-height:58px;transition:border-color .15s,box-shadow .15s}
.au-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.14)}
.au-in.bad{border-color:var(--danger)}
.au-in svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.au-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--f-body);padding:16px 0;outline:none}
.au-in input::placeholder{color:#6f7d74}
.au-eye{border:0;background:transparent;padding:8px;margin-right:-8px;border-radius:8px;cursor:pointer;display:grid;place-items:center;min-width:40px;min-height:40px}
.au-eye:hover svg,.au-eye[aria-pressed="true"] svg{stroke:var(--accent)}
.au-help{color:var(--muted);font-size:12.5px}
.au-err{color:var(--danger);font-size:13px}
.au-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border:0;border-radius:13px;background:var(--accent);color:var(--on-accent);
  font:700 17px var(--f-display);cursor:pointer;text-decoration:none;box-shadow:0 10px 34px rgba(245,158,11,.22);margin-top:6px;transition:filter .15s,transform .05s}
.au-btn:hover{filter:brightness(1.06)}
.au-btn:active{transform:translateY(1px)}
.au-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.au-hr{border:0;border-top:1px solid var(--line);margin:30px 0 22px;width:100%}
.au-alt{margin:0;color:var(--muted);font-size:15px}
.au-alt a,.au-body a:not(.au-btn){color:var(--accent);font-weight:600;text-decoration:none}
.au-alt a:hover{text-decoration:underline}
.au-form .au-alt{text-align:right;margin-top:-6px;font-size:14px}
.au-msg{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.au-msg.bad{border-color:rgba(242,139,130,.45);background:rgba(242,139,130,.08)}
.authp .or{margin:18px 0}
.au-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#8a978e;font-size:13px}  /* kontrast ≥ 4.5 */
.au-foot nav{display:flex;gap:18px}
.au-foot a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:40px}
.au-foot a:hover{color:var(--ink)}
@media (max-width:980px){
  .au{grid-template-columns:minmax(0,1fr)}
  .au-art{margin:12px 12px 0;border-radius:20px;min-height:0}
  .au-canvas{flex:none;aspect-ratio:4/3}
  .au-bottom{display:none}
  .au-top{padding:14px 16px 0;font-size:12.5px;white-space:nowrap}
  .au-rot{display:none}
  .au-brand small{display:none}
  .au-brand .mark{width:42px;height:42px}
  .au-main{padding:20px 16px}
  .au-body{max-width:none;padding-block:28px}
}
/* 3D xona: ilova muharririda va bosh sahifa kalkulyatorida */
.roomplan{padding:6px;overflow:hidden;background:radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%),var(--surface)}
.roomplan .r3d{aspect-ratio:16/8;max-height:320px}
.calc-plan .r3d{aspect-ratio:16/10}

/* ================= "Proba" dizayni: yon panelli qobiq (shell.html), Boshqaruv paneli, Smeta loyihalari ================= */
body.shell{padding-bottom:0;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;--forest:#0f172a;--forest2:#0b1120}
/* yon panel: faqat <aside> — element qo'shish oynasidagi .sb (sheet body) bilan to'qnashmasin */
aside.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:linear-gradient(180deg,var(--forest),var(--forest2));color:#e6f2ea;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:2px 4px}
.sb-logo{width:40px;height:40px;border-radius:11px;background:#d97706;display:grid;place-items:center;flex:none}
.sb-logo svg,.sb-nav svg,.sb-foot svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-logo svg{width:22px;height:22px;color:#fff}
.sb-brand b{display:block;font:700 18px var(--f-display)}
.sb-brand small{display:block;font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#fcd34d;opacity:.9}
.sb-status{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.sb-status b{display:block;font-size:13px;color:#fcd34d}
.sb-status small{display:block;font-size:12px;color:#cbd5e1}
.sb-status i{width:8px;height:8px;border-radius:99px;background:#fbbf24;box-shadow:0 0 8px #fbbf24;flex:none}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#dbeae0;text-decoration:none;font-weight:500;font-size:14.5px}
.sb-nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-nav a[aria-current="page"]{background:#d97706;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(217,119,6,.35)}
.sb-nav svg{width:19px;height:19px;flex:none}
.sb-foot{margin-top:auto;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;font-size:12px;color:#cbd5e1}
.sb-foot b{display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;margin-bottom:4px}
.sb-foot svg{width:17px;height:17px}
.shell-main{min-width:0;display:flex;flex-direction:column}
.tb{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:42px;place-items:center;cursor:pointer;color:var(--ink)}
.tb-menu svg,.tb-search svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tb-search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:0 12px;color:var(--muted)}
.tb-search:focus-within{border-color:var(--accent);background:var(--surface)}
.tb-search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;color:var(--ink);outline:none}
.tb-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.tb-pill.ok{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tb-pill i{width:7px;height:7px;border-radius:99px;background:currentColor}
.tb .prefs{margin-left:0}
.tb-user{display:flex;align-items:center;gap:10px;margin-left:auto;text-align:right}
.tb-user b{display:block;font-size:14px}
.tb-user small{display:block;font-size:12px;color:var(--muted)}
.tb-user form{margin:0}
.tb-avatar{width:40px;height:40px;border-radius:99px;background:#d97706;color:#fff;display:grid;place-items:center;font:700 13px var(--f-body);flex:none}
.shell-page{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px}
.shell-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:16px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.shell-foot nav{display:flex;gap:18px}
.shell-foot a{color:inherit;text-decoration:none}
.sb-scrim{display:none}
/* sahifa sarlavhasi, chiplar, tugmalar */
.pg-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.pg-head h1{font:800 clamp(28px,3.2vw,40px)/1.08 var(--f-display);letter-spacing:-.02em;margin:6px 0 8px}
.pg-sub{margin:0;color:var(--muted);max-width:60ch}
.pg-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pg-acts form{margin:0}
.pg-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.chip-g,.chip-l,.chip-d,.chip-a{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.chip-g{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.chip-l{color:var(--muted)}
.chip-l svg,.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip-d{background:rgba(255,255,255,.12);color:#e6f2ea;border:1px solid rgba(255,255,255,.14)}
.chip-a{background:#d97706;color:#fff}
.btn.ol{background:var(--surface);border-color:var(--line)}
.btn.ol:hover{border-color:var(--accent);color:var(--accent)}
.btn.lg{padding:11px 18px;font-size:15px;border-radius:11px}
.btn.block{display:flex;width:100%;justify-content:center}
.lnk{color:var(--accent);font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--muted)}
.dot.ok{background:#f59e0b;box-shadow:0 0 0 4px color-mix(in srgb,#f59e0b 20%,transparent)}
.dot.wait{background:#f59e0b;box-shadow:0 0 0 4px color-mix(in srgb,#f59e0b 20%,transparent)}
.pbar{display:block;height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:#d97706}
/* KPI kartalari */
.kpi4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi2{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi2::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:99px;background:var(--kc,#d97706);opacity:.12;filter:blur(18px)}
.kpi2.k2{--kc:#d97706}.kpi2.k3{--kc:#f59e0b}.kpi2.k4{--kc:#f59e0b}
.k-top{display:flex;justify-content:space-between;align-items:center}
.k-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,#d97706) 14%,var(--surface));color:var(--kc,#d97706);flex:none}
.k-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-badge{font:700 12px var(--f-mono);padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--kc,#d97706) 14%,var(--surface));color:color-mix(in srgb,var(--kc,#d97706) 70%,var(--ink))}
.k-lab{margin:14px 0 4px;font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.k-val{margin:0}
.k-val b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.k-val span{color:var(--muted);font-size:14px}
.k-foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.k-foot b{color:var(--ink);font-weight:600}
/* ikki ustunli joylashuv */
.dgrid,.ly-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
/* Panellar menyusi (js/panels.js): yashirilgan karta joy egallamaydi; ustun bo'shab qolsa, ikkinchisi to'liq kenglikda */
[data-panel][hidden]{display:none!important}
.dgrid:not(:has(.dcol.side > :not([hidden]))),.dgrid:not(:has(.dcol:not(.side) > :not([hidden]))){grid-template-columns:minmax(0,1fr)}
.dcol:not(:has(> :not([hidden]))){display:none}
.pnl{position:relative}
.pnl>summary{list-style:none;cursor:pointer}
.pnl>summary::-webkit-details-marker{display:none}
.pnl>summary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pnl-n{font:600 11px var(--f-mono);color:var(--muted)}
.pnl-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:270px;padding:14px;display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
.pnl-pop .eyebrow{margin:0 0 4px}
.pnl-pop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.pnl-pop label:hover{background:var(--surface2)}
.pnl-pop input{width:16px;height:16px;accent-color:var(--accent)}
.pnl-pop .btn{margin-top:6px}
@media (max-width:760px){.pnl-pop{right:auto;left:0}}
.dcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{padding:20px;border-radius:16px}
.card.flush{padding:0}
.pad2{padding:18px 20px}
.card h2{font:700 18px var(--f-display);margin:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card.flush .card-h{margin:0}
.card-f{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.card.flush .card-f{margin:0}
/* 3D model kartasi */
.model{position:relative;overflow:hidden;border-radius:18px;min-height:430px;color:#fff;box-shadow:var(--shadow);
  background:radial-gradient(80% 70% at 55% 40%,#1e293b 0%,#111827 55%,#0b1120 100%)}
.model::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/44px 44px;pointer-events:none}
.model-3d{position:absolute;inset:40px 0 110px;width:100%;height:calc(100% - 150px);aspect-ratio:auto}
.model-top{position:relative;padding:20px 22px 0;max-width:62%;pointer-events:none}
.model-top h2{font:800 clamp(22px,2.4vw,30px)/1.15 var(--f-display);margin:10px 0 4px}
.model-loc{margin:0;color:#cbd5e1;font-size:14px}
.model-st{position:absolute;top:18px;right:18px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;text-align:right}
.model-st small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#cbd5e1}
.model-st b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.model-st b i{width:7px;height:7px;border-radius:99px;background:#fbbf24}
.model-bar{position:absolute;left:16px;right:16px;bottom:16px;display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:14px;background:rgba(3,20,10,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);border-radius:14px;padding:14px 16px}
.model-bar small{display:block;font-size:12px;color:#cbd5e1}
.model-bar b{display:block;font-size:18px}
.model-bar b.big{font-size:26px;color:#fcd34d}
.model-bar .pbar{background:rgba(255,255,255,.14);margin:8px 0 4px}
.model-bar .pbar i{background:#fbbf24}
/* xonalar (bosqichlar) */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.st-h{display:flex;justify-content:space-between;align-items:center;font:600 12px var(--f-mono);color:var(--accent)}
.st-ok{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2}
.stage b{font-size:15px}
.stage small{color:var(--muted);font-size:12.5px}
.st-p{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.st-p b{font:700 14px var(--f-mono)}
/* jadval */
.dtable{border:0;border-radius:0;background:transparent}
.dtable th{background:var(--surface2);font-size:11px}
.dtable td{vertical-align:top;padding:12px 10px}
.dtable td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dtable td.code{color:var(--accent);font-weight:600;white-space:nowrap}
.dtable td.u{color:var(--muted)}
.mbar{display:block;height:4px;border-radius:99px;background:#0f766e;margin-top:6px;overflow:hidden;width:90px;margin-left:auto}
.mbar i{display:block;height:100%;background:#d97706}
.legend-i{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.legend-i i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-m{background:#d97706}.lg-l{background:#0f766e;margin-left:8px}
/* o'ng ustun */
.side .card{position:relative}
.hl{background:var(--surface2);border-radius:12px;padding:14px}
.hl-h{display:flex;justify-content:space-between;gap:8px}
.hl-h span{font:700 13px var(--f-mono);color:var(--accent)}
.hl p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.hl .hl-v{color:var(--ink)}
.hl-v b{font-size:26px}
.cats{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.cat-h b{font-family:var(--f-mono);color:var(--accent);font-size:12.5px;white-space:nowrap}
.feed{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.f-ic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);display:grid;place-items:center;flex:none}
.f-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feed a{color:var(--ink);font-weight:600;text-decoration:none}
.feed a:hover{color:var(--accent)}
.feed small{display:block;color:var(--muted);font-size:12.5px}
.feed .f-t{font-family:var(--f-mono);font-size:11.5px;margin-top:2px}
.gcard{background:linear-gradient(160deg,#1e293b,#0f172a);color:#e6f2ea;border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.gcard-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:700;color:#fcd34d}
.gcard-h svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.gcard p{margin:0;font-size:14px;line-height:1.55}
.gcard-f{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:#cbd5e1}
.gcard-f a{color:#fcd34d;font-weight:600;text-decoration:none}
/* Smeta loyihalari: hero */
.hero-g{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:28px;align-items:center;border-radius:20px;padding:32px;color:#fff;box-shadow:var(--shadow);
  background:radial-gradient(60% 90% at 85% 20%,rgba(251,191,36,.14),transparent 60%),linear-gradient(160deg,#1e293b,#0b1120)}
.hero-g h1{font:800 clamp(28px,3.2vw,42px)/1.08 var(--f-display);letter-spacing:-.02em;margin:14px 0 12px}
.hg-text>p:not(.pg-chips){margin:0;color:#cbd5e1;max-width:58ch;line-height:1.6}
.hg-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.hk{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px}
.hk small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#cbd5e1}
.hk b{display:block;font-size:26px;margin-top:6px}
.hk span{font-size:13px;color:#cbd5e1}
.hk em{display:block;font-style:normal;font-size:12px;color:#fcd34d;margin-top:4px}
.hg-fig{position:relative;margin:0;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.hg-fig .r3d{aspect-ratio:4/3}
.hg-fig figcaption{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(3,20,10,.75);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.hg-fig figcaption svg{width:20px;height:20px;fill:none;stroke:#fcd34d;stroke-width:1.8;flex:none}
.hg-fig small{display:block;font-size:11.5px;color:#cbd5e1}
.hg-fig b{font-size:14px}
.ly-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px}
.ly-tools form{margin:0}
.ly-seg{background:var(--surface2);padding:3px;border:0;border-radius:10px}
.ly-seg button{border-radius:8px;padding:8px 12px}
.ly-seg button+button{border-left:0}
.ly-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ly-search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}
.ly-search svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.ly-search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;color:var(--ink);min-width:0}
.ly-table a.oname{font-weight:700;color:var(--ink);text-decoration:none}
.ly-table a.oname:hover{color:var(--accent)}
.ly-table td{vertical-align:middle}
.ly-table .oacts{justify-content:flex-end;flex-wrap:nowrap}
.ly-table .tag{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
/* tezkor kalkulyator */
.qc-t{display:flex;gap:12px;align-items:center}
.qc-f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-bottom:12px}
.qc-stp{display:flex;align-items:stretch;gap:6px}
.qc-stp .stp-b{display:grid;place-items:center;width:40px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;font:600 18px var(--f-mono);cursor:pointer;color:var(--ink)}
.qc-stp .inp{flex:1;text-align:center}
.qc-lines{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.qc-lines div{display:grid;grid-template-columns:1fr auto;gap:0 10px;background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:13px}
.qc-lines b{text-align:right}
.qc-lines small{grid-column:1 / -1;text-align:right;color:var(--muted);font-size:11.5px}
.qc-vat{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:12px}
.qc-sum{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.qc-sum div{display:flex;justify-content:space-between;gap:8px}
.qc-sum span{color:var(--muted)}
.qc-g{align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.qc-g span{color:var(--ink)!important;font-weight:700;font-size:15px}
.qc-g b{font-size:22px;color:var(--accent)}
.qc-g small{width:100%;text-align:right;color:var(--muted)}
.tip h2{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:17px;margin-bottom:10px}
.tip h2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.tip p{color:var(--muted);line-height:1.6;margin:0 0 10px;font-size:14px}
@media (max-width:1200px){.dgrid,.ly-grid{grid-template-columns:minmax(0,1fr)}.stages{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-g{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  body.shell{grid-template-columns:minmax(0,1fr)}
  aside.sb{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s}
  body.sb-open aside.sb{transform:none}
  body.sb-open .sb-scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.45);border:0}
  .tb{padding:10px 14px;gap:8px}
  .tb-menu{display:grid}
  .tb-search,.tb-pill,.tb .seg{display:none}
  .shell-page{padding:16px}
}
@media (max-width:760px){
  .kpi4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .kpi2{padding:12px}
  .k-val b{font-size:22px}
  .model{min-height:380px}
  .model-top{max-width:100%}
  .model-st{display:none}
  .model-bar{grid-template-columns:1fr 1fr}
  .model-bar .mb-p{grid-column:1 / -1}
  .stages{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hero-g{padding:20px}
  .hg-k{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ly-table .c-area,.ly-table th:nth-child(3){display:none}
}

/* ================= Yorug' kirish sahifasi (registration/_auth.html, body.authp2) ================= */
body.authp2{padding-bottom:0;background:radial-gradient(40% 50% at 18% 30%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%),var(--bg)}
.ah{background:var(--surface);position:sticky;top:0;z-index:10}
.ah-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px}
.ah-brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.ah-brand .mark{width:40px;height:40px;border-radius:10px;background:#d97706;color:#fff;display:grid;place-items:center;font:700 19px var(--f-display)}
.ah-brand b{display:block;font:700 19px var(--f-display)}
.ah-brand small{display:block;color:var(--muted);font-size:13px}
.ah-acts{display:flex;align-items:center;gap:10px}
.ah-rule{height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 8px) bottom/100% 5px no-repeat,#0f172a}
.ahm{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:48px;align-items:center;padding:56px 24px 40px}
.ah-pill{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font:600 12.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.ah-pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ah-left h1{font:800 clamp(32px,3.8vw,48px)/1.1 var(--f-display);letter-spacing:-.03em;margin:0 0 14px}
.ah-left h1 em{display:block;font-style:normal;color:var(--accent)}
.ah-lead{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 26px;max-width:52ch}
.ah-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:490px;margin-bottom:22px}
.ah-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.ah-stats b{display:flex;align-items:center;gap:6px;font:700 19px var(--f-display)}
.ah-stats b svg{width:19px;height:19px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.ah-stats span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.ah-proj{max-width:490px;background:#111827;color:#e6f2ea;border-radius:14px;padding:16px 18px;box-shadow:0 16px 40px rgba(15,23,42,.25);font-family:var(--f-mono)}
.ap-h{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:12px}
.ap-h span:first-child{display:flex;align-items:center;gap:8px;font-weight:600}
.ap-h i{width:8px;height:8px;border-radius:99px;background:#fbbf24}
.ap-h span:last-child{color:#fcd34d}
.ap-r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-family:var(--f-body);color:#cbd5e1;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.ap-r b{font-family:var(--f-mono);color:#fcd34d}
.ap-t b{color:#fff;font-size:17px}
.ap-bar{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin:10px 0 12px;overflow:hidden}
.ap-bar i{display:block;height:100%;background:#fbbf24;border-radius:99px}
.ah-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.10);overflow:hidden}
.ah-body{padding:30px 32px 24px}
.ah-eyebrow{margin:0 0 4px;font:700 12.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ah-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ah-body h1{font:700 30px var(--f-display);margin:0 0 10px;letter-spacing:-.01em}
.ah-key{width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));display:grid;place-items:center}
.ah-key svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round}
.authp2 .au-sub{font-size:15px;margin-bottom:22px}
.authp2 .au-form{gap:16px}
.authp2 .au-f label{color:var(--ink);font-weight:600;font-size:14.5px}
.au-lrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.au-lrow label small{font-weight:400;color:var(--muted);font-size:12.5px}
.au-lrow a{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
.authp2 .au-in{background:var(--surface2);border-color:transparent;min-height:50px;border-radius:10px}
.authp2 .au-in:focus-within{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}

  let t = text;
  t = t.replace(/[oO]['`ʻ’]/g, m => m[0] === m[0].toUpperCase() ? "Ў" : "ў");
  t = t.replace(/[gG]['`ʻ’]/g, m => m[0] === m[0].toUpperCase() ? "Ғ" : "ғ");
  t = t.replace(/Sh|SH/g, "Ш").replace(/sh/g, "ш");
  t = t.replace(/Ch|CH/g, "Ч").replace(/ch/g, "ч");
  t = t.replace(/Yo|YO/g, "Ё").replace(/yo/g, "ё");
  t = t.replace(/Yu|YU/g, "Ю").replace(/yu/g, "ю");
  t = t.replace(/Ya|YA/g, "Я").replace(/ya/g, "я");
  t = t.replace(/Ye|YE/g, "Е").replace(/ye/g, "е");
  t = t.replace(/Ts|TS/g, "Ц").replace(/ts/g, "ц");
  const charmap = {
    'A':'А','a':'а','B':'Б','b':'б','D':'Д','d':'д','E':'Э','e':'э',
    'F':'Ф','f':'ф','G':'Г','g':'г','H':'Ҳ','h':'ҳ','I':'И','i':'и',
    'J':'Ж','j':'ж','K':'К','k':'к','L':'Л','l':'л','M':'М','m':'м',
    'N':'Н','n':'н','O':'О','o':'о','P':'П','p':'п','Q':'Қ','q':'қ',
    'R':'Р','r':'р','S':'С','s':'с','T':'Т','t':'т','U':'У','u':'у',
    'V':'В','v':'в','X':'Х','x':'х','Y':'Й','y':'й','Z':'З','z':'з',
    "'":'ъ','ʻ':'ъ','’':'ъ','`':'ъ'
  };
  let res = "", prevAlpha = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (charmap[ch]) {
      let m = charmap[ch];
      if ((ch === 'e' || ch === 'E') && prevAlpha) {
        m = ch === 'E' ? 'Е' : 'е';
      }
      res += m;
      prevAlpha = true;
    } else {
      res += ch;
      prevAlpha = /[a-zA-Zа-яА-ЯёЁ]/.test(ch);
    }
  }

}

  let o = s;
  if (LANG === "ru") {
    o = Object.prototype.hasOwnProperty.call(RU, s) ? RU[s] : s;
  } else if (LANG === "uz_cyr" || LANG === "uz-cyr") {
    o = latinToCyrillic(s);
  }
  a.forEach((v, i) => { o = o.split("{" + i + "}").join(String(v)); });

}

const UNITS_CYR = {dona:"дона",m:"м","m²":"м²","m³":"м³",kg:"кг",l:"л",seksiya:"секция",komplekt:"комплект"};

  if (LANG === "ru") return UNITS_RU[u] || u;
  if (LANG === "uz_cyr" || LANG === "uz-cyr") return UNITS_CYR[u] || latinToCyrillic(u);

};

const lab = o => {
  if (!o) return "";
  if (LANG === "ru" && o.ru) return o.ru;
  if ((LANG === "uz_cyr" || LANG === "uz-cyr")) return latinToCyrillic(o.l || "");

  }
  if (LANG === "uz_cyr" || LANG === "uz-cyr") {

};

function translatePageDOM(lang) {
  try {
    const candidates = document.querySelectorAll("h1, h2, h3, h4, p, span, a, button, label, th, td, dt, dd, small, b, strong, em");
    candidates.forEach(el => {
      if (el.closest(".seg, script, style, code, pre, #calc-plan, svg, select")) return;
      // Only process leaf nodes with text
      if (el.children.length === 0 && el.textContent.trim().length > 0) {
        if (!el.dataset.origText) {
          el.dataset.origText = el.textContent.trim();
        }
        const orig = el.dataset.origText;
        el.textContent = tr(orig);
      }
    });
    // Translate placeholders
    document.querySelectorAll("input[placeholder], textarea[placeholder]").forEach(inp => {

function setAppLanguage(newLang) {
  if (!newLang) return;
  const normalized = newLang.replace("-", "_");
  LANG = normalized;
  try {
    localStorage.setItem("smetago-lang", normalized);
  } catch(e) {}
  document.cookie = `django_language=${normalized === "uz_cyr" ? "uz-cyr" : normalized};path=/;max-age=31536000;SameSite=Lax`;
  document.documentElement.lang = normalized === "ru" ? "ru" : (normalized === "uz_cyr" ? "uz-cyr" : "uz");

  // Update active state on any language switch buttons
  document.querySelectorAll("[data-lang]").forEach(btn => {
    const bl = btn.getAttribute("data-lang").replace("-", "_");
    btn.setAttribute("aria-pressed", bl === normalized ? "true" : "false");
  });

  // Instant DOM translation without page reload!
  translatePageDOM(normalized);

  // Re-render UI components if they exist
  window.dispatchEvent(new CustomEvent("languagechange", { detail: { lang: normalized } }));

  // Background notify server without reload
  try {
    fetch("/i18n/setlang/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `language=${encodeURIComponent(normalized === "uz_cyr" ? "uz-cyr" : normalized)}`
    }).catch(() => {});
  } catch(e) {}
}

<script type="text/plain" id="app-src">/* SmetaGo — ilova mantig'i: holat (state), hisob-kitob, chizish (render) va hodisalar.

}

/* Django orqali ochilganda (window.SMETAGO bor) holat serverdan keladi va serverga saqlanadi.

  const sugg=()=>{const t=ROOM_TYPES[r?.type]||ROOM_DEFAULT;return `<p class="eyebrow" style="margin:0">${esc(tr("{0} uchun odatiy",r?r.name:""))}</p><div class="catgrid">${own()}${t.s.map(id=>CAT_INDEX[id]).filter(Boolean).map(it=>card(it,1)).join("")}</div>`};
  let html="";
  if(q){const res=Object.values(CAT_INDEX).filter(it=>(it.n+" "+(it.v||[]).map(v=>v[0]).join(" ")+" "+it.g).toLowerCase().includes(q));
    html=res.length?`<div class="catgrid">${own(S.ui.q.trim())}${res.map(it=>card(it)).join("")}</div>`:`<p class="note">${esc(tr("\"{0}\" topilmadi — o'zingiz qo'shing:",S.ui.q))}</p><div class="catgrid">${own(S.ui.q.trim())}</div>`}
  else if(S.ui.grp==="Tavsiya")html=sugg();

  box.innerHTML=html;

// eshik/deraza yonidagi m² va jami; qoplama o'lchamlari placeholder'i (xona o'lchami)
function updOpenings(r,c){const m2=U("m²");const set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};
  r.doors.forEach((d,i)=>set(`d-${i}-a`,`= ${fd(openA(d)*doorQ(d))} ${m2}`));
  r.windows.forEach((w,i)=>set(`w-${i}-a`,`= ${fd(openA(w))} ${m2}`));
  const dq=sum(r.doors.map(doorQ));
  set("doors-sum",r.doors.length?tr("Jami: {0} ta eshik, {1} m²",fd(dq,Number.isInteger(dq)?0:2),fd(c.doorA)):"");
  set("wins-sum",r.windows.length?tr("Jami: {0} ta deraza, {1} m²",r.windows.length,fd(c.winA)):"");
  document.querySelectorAll("[data-ph]").forEach(el=>{el.placeholder=r[el.dataset.ph]??""});
}
