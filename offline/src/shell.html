<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="smetago-version" content="@@VERSION@@">
<title>SmetaGo</title>
<script>
/* til (UZ/RU) va ekran (ro'yxat yoki muharrir) — sahifa chizilishidan oldin */
(function(){var l="uz";try{if(localStorage.getItem("smetago-off-lang")==="ru")l="ru"}catch(e){}
  var h=document.documentElement;h.lang=l;h.className=/^#p=[\w-]+$/.test(location.hash)?"m-editor":"m-home";})();
</script>
<script>/*@@PREFS_JS@@*/</script>
<style>/*@@CSS@@*/</style>
<style>
/* oflayn ilova: ro'yxat / muharrir ekranlari */
.m-home .editor-only,.m-editor .home-only{display:none!important}
.m-home body{padding-bottom:24px}
.off-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 16px}
.off-head h1{margin:0;font-size:clamp(24px,5vw,34px)}
.off-list{display:flex;flex-direction:column;gap:10px}
.off-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.off-open{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;color:var(--ink);text-decoration:none}
.off-open b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.off-open small{color:var(--muted);font-size:12.5px}
.off-sum{color:var(--accent);font-weight:700;font-size:15px;margin-top:2px}
.off-acts{display:flex;gap:6px;align-items:center;flex:none}
.off-acts .btn{min-height:40px}
.off-empty{color:var(--muted);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:12px}
.off-backup{margin-top:28px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.off-backup h2{font-size:16px;margin:0 0 6px}
.off-backup p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.off-backup .row{display:flex;flex-wrap:wrap;gap:8px}
.top .prefs .seg button{min-width:40px}
/* son maydonlari butunlay bo'sh ko'rinsin (kulrang "0,00", "1" maslahatlari ham yo'q) — foydalanuvchi o'zi kiritadi */
.m-editor input.numin::placeholder,.m-editor #m-qty::placeholder{color:transparent}
.off-ver{margin:18px 0 8px;text-align:center;color:var(--muted);font-size:12px}
#update-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body class="in">
<header class="top">
  <div class="wrap">
    <button type="button" class="btn sm editor-only" id="home-btn">← <span data-t="Smetalar">Smetalar</span></button>
    <div class="brand"><div class="mark"><img class="logo-img" src="@@LOGO@@" alt="" width="40" height="40"></div><div>SmetaGo</div></div>
    <div class="objmeta editor-only">
      <input class="inp" id="o-name" data-o="name" aria-label="Obyekt nomi" placeholder="Obyekt nomi">
      <span class="save-status save-saved" id="save-status" role="status" aria-live="polite"><i class="save-dot" aria-hidden="true"></i><span class="save-text" data-t="Saqlandi">Saqlandi</span></span>
    </div>
    <div class="prefs">
      <div class="seg" role="group" aria-label="Til">
        <button type="button" data-off-lang="uz" lang="uz" title="O'zbekcha">UZ</button>
        <button type="button" data-off-lang="ru" lang="ru" title="Русский">RU</button>
      </div>
      <button type="button" class="themebtn" data-theme-toggle aria-pressed="false" data-l-night="Tungi rejim" data-l-day="Kunduzgi rejim">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="ruler" aria-hidden="true"></div>
  <nav class="wrap tabs editor-only" id="tabs" role="tablist"></nav>
</header>

<main class="wrap editor-only" id="app"></main>
<div class="totalbar editor-only" id="totalbar"></div>
<nav class="bnav editor-only" id="bnav" aria-label="Bo'limlar"></nav>

<main class="wrap home-only" id="home">
  <div class="off-head">
    <h1 data-t="Mening smetalarim">Mening smetalarim</h1>
    <button type="button" class="btn pri lg btn-new-smeta" id="new-btn">+ <span data-t="Yangi smeta">Yangi smeta</span></button>
  </div>
  <div class="off-list" id="home-list"></div>
  <section class="off-backup">
    <h2 data-t="Zaxira nusxa">Zaxira nusxa</h2>
    <p data-t="Smetalar faqat shu telefonda saqlanadi. Ilovani o'chirish yoki telefonni almashtirishdan oldin zaxira nusxa oling.">Smetalar faqat shu telefonda saqlanadi.</p>
    <div class="row">
      <button type="button" class="btn" id="export-btn" data-t="Zaxira nusxa olish">Zaxira nusxa olish</button>
      <button type="button" class="btn" id="import-btn" data-t="Zaxiradan tiklash">Zaxiradan tiklash</button>
    </div>
  </section>
  <p class="off-ver"><span data-t="Versiya">Versiya</span>: @@VERSION_LABEL@@</p>
</main>

<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="undo-bar" class="undo-bar" role="status" aria-live="polite" hidden><span></span><button type="button" class="btn sm" data-t="Qaytarish">Qaytarish</button></div>
<div id="update-bar" class="undo-bar" role="status" aria-live="polite" hidden><span data-t="Yangi versiya tayyor">Yangi versiya tayyor</span><button type="button" class="btn sm" id="update-btn" data-t="Yangilash">Yangilash</button></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script type="application/json" id="ref-uz">@@REF_UZ@@</script>
<script type="application/json" id="ref-ru">@@REF_RU@@</script>
<script>
/* tanlangan til ma'lumotnomasi (katalog, narxlar, xona turlari) — data.js #smeta-ref dan o'qiydi */
(function(){var src=document.getElementById(document.documentElement.lang==="ru"?"ref-ru":"ref-uz");
  var s=document.createElement("script");s.type="application/json";s.id="smeta-ref";s.textContent=src.textContent;document.body.appendChild(s);})();
</script>
<script>/*@@I18N_JS@@*/</script>
<script>/*@@DATA_JS@@*/</script>
<script>/*@@CALC_JS@@*/</script>
<script>
/* sarlavhadagi statik yozuvlar tarjimasi */
document.querySelectorAll("[data-l-night]").forEach(function(b){b.setAttribute("data-l-night",tr("Tungi rejim"));b.setAttribute("data-l-day",tr("Kunduzgi rejim"))});
(function(){var n=document.getElementById("o-name");n.placeholder=tr("Obyekt nomi");n.setAttribute("aria-label",tr("Obyekt nomi"))})();
</script>
<script>/*@@STORE_JS@@*/</script>
<script type="text/plain" id="app-src">/*@@APP_JS@@*/</script>
<script>
/* muharrir: app.js (saytdagi bilan bir xil) global skript sifatida ishga tushadi — calc.js global S ni o'qiydi */
if(window.SMETAGO_STORE){var s=document.createElement("script");s.textContent=document.getElementById("app-src").textContent;document.body.appendChild(s);}
</script>
</body>
</html>
