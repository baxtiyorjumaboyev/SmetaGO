{% load smeta_i18n %}{% if tg_bot %}{# Telegram Login Widget: tasdiqlangach /kirish/telegram/ ga qaytadi (smeta/telegram.py) #}
{% url 'telegram_auth' as tg_url %}<div class="tg-login">
  <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="{{ tg_bot }}" data-size="large" data-radius="8"
          data-auth-url="{{ request.scheme }}://{{ request.get_host }}{{ tg_url }}" data-request-access="write" data-lang="{{ LANGUAGE_CODE }}"></script>
</div>{% endif %}
