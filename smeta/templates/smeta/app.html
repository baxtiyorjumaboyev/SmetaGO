{% load static smeta_i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
{% include "smeta/_head.html" %}
<title>{{ o.name }} · SmetaGo</title>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="btn sm" href="{% url 'obyekt_list' %}" title="{% t 'Barcha obyektlar' %}">←<span class="deskonly"> {% t "Obyektlar" %}</span></a>
    <div class="brand"><div class="mark">S</div><div>SmetaGo<small>{% t "o'lchang · tanlang · hisoblang" %}</small></div></div>
    <div class="objmeta">
      <input class="inp" id="o-name" data-o="name" aria-label="{% t 'Obyekt nomi' %}" placeholder="{% t 'Obyekt nomi' %}">
      <select class="inp" id="o-region" data-o="region" aria-label="{% t 'Hudud' %}" style="width:auto"></select>
      <select class="inp" id="o-quarter" data-o="quarter" aria-label="{% t 'Narxlar choragi' %}" style="width:auto"></select>
    </div>
    {% include "smeta/_prefs.html" %}
  </div>
  <div class="ruler" aria-hidden="true"></div>
  <nav class="wrap tabs" id="tabs" role="tablist"></nav>
</header>
<main class="wrap" id="app"></main>
<div class="totalbar" id="totalbar"></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
{{ o.state|json_script:"smeta-state" }}
{{ ref|json_script:"smeta-ref" }}
<script>
window.SMETAGO = {
  saveUrl: "{% url 'obyekt_state' o.pk %}",
  csrf: "{{ csrf_token }}",
  name: "{{ o.name|escapejs }}",
  updated: "{{ o.updated|date:'c' }}"
};
</script>
<script src="{% static 'smeta/js/i18n.js' %}"></script>
<script src="{% static 'smeta/js/data.js' %}"></script>
<script src="{% static 'smeta/js/app.js' %}"></script>
</body>
</html>
