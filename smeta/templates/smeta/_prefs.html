{% load smeta_i18n %}<div class="prefs">
  <span class="netbadge" data-netbadge hidden>{% t "Oflayn" %}</span>
  <button type="button" class="btn sm pri installbtn" data-install hidden title="{% t "Ilovani o'rnatish" %}" aria-label="{% t "Ilovani o'rnatish" %}">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="deskonly">{% t "Ilovani o'rnatish" %}</span>
  </button>
  <span id="pwa-l10n" hidden data-offline="{% t "Internet yo'q. Bu amal uchun aloqa kerak." %}" data-ios="{% t "iPhone / iPad: Safari'da «Ulashish» tugmasini bosing, so'ng «Bosh ekranga qo'shish»." %}"></span>
  <form class="seg" method="post" action="{% url 'set_language' %}" aria-label="{% t 'Til' %}">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button name="language" value="uz" lang="uz" title="O'zbekcha" aria-pressed="{% if LANGUAGE_CODE == 'ru' %}false{% else %}true{% endif %}">UZ</button>
    <button name="language" value="ru" lang="ru" title="Русский" aria-pressed="{% if LANGUAGE_CODE == 'ru' %}true{% else %}false{% endif %}">RU</button>
  </form>
  <button type="button" class="themebtn" data-theme-toggle aria-pressed="false"
          data-l-night="{% t 'Tungi rejim' %}" data-l-day="{% t 'Kunduzgi rejim' %}" title="{% t 'Tungi rejim' %}" aria-label="{% t 'Tungi rejim' %}">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
